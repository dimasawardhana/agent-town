<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Town</title>
    <style>
      /* The town's own lettering, carried in the binary rather than fetched.
         The daemon binds loopback and must never reach the network at runtime,
         so a web font host is not an option; the woff2 files sit in the source
         and travel inside the Go binary with everything else. */
      @font-face {
        font-family: "Silkscreen";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("./src/assets/fonts/silkscreen-regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Silkscreen";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("./src/assets/fonts/silkscreen-bold.woff2") format("woff2");
      }

      :root {
        color-scheme: dark;

        /* The panel is the town's instrument, so it is built from the same
           palette as the town: slate ground, one warm accent, and a hard 1px
           bevel instead of a soft shadow. A 16-bit interface has no blur in
           it, and a soft shadow here would be the one piece of the page that
           came from somewhere else. */
        --void: #0e141c;
        --panel: #161d27;
        --raised: #1e2733;
        --sunken: #101620;
        --edge: #2c3846;
        --edge-lit: #3d4d5e;
        --edge-dark: #0a0e14;
        --text: #d7e0ea;
        --text-dim: #8595a8;
        --accent: #e6bb38;
        --accent-dim: #8a6414;
        --ok: #6fbf7a;
        --down: #cf5a42;
        --testing: #5aa9d9;
        --done: #57b8a0;

        --pixel: "Silkscreen", "Courier New", monospace;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: var(--void);
        color: var(--text);
        font: 12px/1.55 var(--mono);
        overflow: hidden;
      }

      /* Browser surfaces are part of the design. A default blue selection and
         a grey scrollbar on a 16-bit panel are the cheapest tell that a page
         was assembled rather than built. */
      ::selection { background: var(--accent); color: var(--void); }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: var(--sunken); }
      ::-webkit-scrollbar-thumb {
        background: var(--edge);
        border: 2px solid var(--sunken);
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--edge-lit); }
      * { scrollbar-color: var(--edge) var(--sunken); scrollbar-width: thin; }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      /* The one bevel recipe, and the panel's whole depth system: a 1px lit
         edge top-left and a 1px dark edge bottom-right. A 16-bit interface has
         no blur in it, so this is the only shadow in the panel — declared once
         here and applied by class, never re-inlined, so the pressed state
         cannot drift from the raised one. */
      .bevel {
        box-shadow:
          inset 1px 1px 0 var(--edge-lit),
          inset -1px -1px 0 var(--edge-dark);
      }
      /* Pressed, and any deliberately sunken surface: the same recipe inverted,
         which is what makes a press read as the surface moving inward. */
      .bevel:active,
      .bevel-in {
        box-shadow:
          inset 1px 1px 0 var(--edge-dark),
          inset -1px -1px 0 var(--edge-lit);
      }

      .app { display: flex; height: 100%; }
      #town { flex: 1; position: relative; min-width: 0; }
      #town canvas {
        display: block;
        /* The town is pannable and zoomable, so say so. Without a cursor the
           canvas reads as a static picture and nobody discovers the drag. */
        cursor: grab;
        /* Belt and braces with the game's own `pixelArt` setting: that governs
           how Phaser samples textures into the canvas, this governs how the
           browser scales the canvas itself onto a high-DPI display. Missing
           either one softens the whole town. */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* Dragging must not start a text selection over the canvas. */
        user-select: none;
        -webkit-user-select: none;
      }
      #town canvas:active { cursor: grabbing; }

      .panel {
        width: 316px;
        flex: none;
        border-left: 2px solid var(--edge-dark);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* The title bar is the panel's one piece of pure chrome: town name in the
         town's own face, with the connection lamp at the end of it. */
      .panel header {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px;
        background: var(--raised);
        border-bottom: 2px solid var(--edge-dark);
      }
      .panel h1 {
        font-family: var(--pixel);
        font-size: 16px;
        font-weight: 400;
        letter-spacing: .01em;
        margin: 0;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }
      /* A square lamp, not a circle: a 16-bit status light is a filled cell. */
      .dot {
        width: 8px; height: 8px; flex: none; margin-left: auto;
        background: var(--down);
        box-shadow: inset 1px 1px 0 rgba(255,255,255,.28);
      }
      .dot.ok { background: var(--ok); }
      .dot.down { background: var(--down); }
      .lamp-label {
        font-family: var(--pixel); font-size: 8px; color: var(--text-dim);
        text-transform: uppercase;
      }

      .meta {
        margin: 0;
        padding: 8px 14px;
        color: var(--text-dim);
        font-size: 11px;
        border-bottom: 1px solid var(--edge);
      }

      section { border-bottom: 1px solid var(--edge); }
      section:last-of-type { border-bottom: none; }

      .switcher { padding: 12px 14px; }
      .switcher label,
      .panel h2 {
        display: block;
        font-family: var(--pixel);
        font-size: 8px;
        font-weight: 400;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: .06em;
        margin: 0 0 8px;
      }
      .switcher select {
        width: 100%;
        background: var(--sunken);
        color: var(--text);
        border: 1px solid var(--edge);
        border-radius: 0;
        padding: 6px 8px;
        font: inherit;
        font-size: 12px;
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--text-dim) 50%),
          linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
        background-position: right 12px center, right 7px center;
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        cursor: pointer;
      }
      .switcher select:hover { border-color: var(--edge-lit); }
      .switcher .path {
        margin: 6px 0 0; overflow-wrap: anywhere; font-size: 10px;
        color: var(--text-dim);
      }

      .muted {
        color: var(--text-dim);
        padding: 12px 14px;
        margin: 0;
        font-size: 11px;
        line-height: 1.6;
      }
      .muted code {
        font-family: var(--mono);
        background: var(--sunken);
        border: 1px solid var(--edge);
        padding: 1px 4px;
        color: var(--text);
      }

      /* An error names the problem and where it came from, in the world's own
         signal colour. It is never a bare "something went wrong". */
      .error {
        color: #f0a08a;
        background: #2a1a18;
        border-top: 1px solid var(--down);
        border-bottom: 1px solid var(--down);
        padding: 8px 14px;
        margin: 0;
        font-size: 11px;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .error::before { content: "!"; color: var(--down); font-family: var(--pixel); }

      .detail { padding: 12px 14px; background: var(--sunken); }
      .detail h2 { color: var(--accent); }
      .detail dl {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 12px;
        font-size: 11px;
      }
      .detail dt { color: var(--text-dim); }
      /* A place's description, at the top of its detail panel: the first thing
         a reader who clicked the Depot needs, before any of the numbers. */
      .detail .blurb {
        margin: 0 0 10px;
        font-size: 11px;
        line-height: 1.55;
        color: var(--text-dim);
      }
      .detail dd { margin: 0; overflow-wrap: anywhere; }
      .detail dd.path { color: var(--done); }
      /* The stage is the one thing in this panel a developer is looking for, so
         it takes the accent. Damage takes the signal colour, which is the only
         other place in the panel a hue carries meaning rather than identity. */
      .detail dd.stage { color: var(--accent); }
      .detail dd.stage.damaged { color: var(--down); }
      .detail dd.problems { color: var(--down); }
      .detail button {
        margin-top: 10px;
        font-family: var(--pixel);
        font-size: 8px;
        text-transform: uppercase;
        letter-spacing: .06em;
        background: var(--raised);
        color: var(--text);
        border: none;
        padding: 7px 11px;
        cursor: pointer;
      }
      .detail button:hover { background: var(--edge); }
      /* The legend explains the three places, which the map can only name.
         Each entry is ruled on its own left edge and carries a live count, so
         the panel answers "where is the work happening" as well as "what is a
         Depot". The count only appears when a place is occupied: a column of
         zeroes is noise, and its absence already says the place is empty. */
      .legend { padding: 12px 0; }
      .legend h2 { margin: 0 14px 8px; }
      .legend ul { list-style: none; margin: 0; padding: 0; }
      .legend li {
        padding: 6px 14px 6px 12px;
        border-left: 1px solid var(--edge);
      }
      .legend li.busy { border-left-color: var(--accent); }
      .legend .nm {
        font-family: var(--pixel);
        font-size: 8px;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--text);
      }
      .legend .cnt {
        font-family: var(--pixel);
        font-size: 8px;
        color: var(--void);
        background: var(--accent);
        padding: 1px 4px;
        margin-left: 6px;
      }
      .legend .cnt:empty { display: none; }
      .legend .blurb {
        margin: 4px 0 0;
        font-size: 11px;
        line-height: 1.5;
        color: var(--text-dim);
      }



      /* The detail control. It sits above the legend because it changes what
         the map contains, and a reader who cannot see their building needs the
         reason before they need the explanation of the Depot. */
      .detail-control { padding: 12px 14px; }
      .detail-control label {
        display: block;
        font-size: 11px;
        color: var(--text);
        margin-bottom: 7px;
      }
      .detail-control input[type="range"] {
        width: 100%;
        margin: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }
      /* The view controls: two equal buttons on one row, so neither reads as
         the primary action — turning is symmetric and the panel should not
         suggest a preferred direction. */
      .view-control { padding: 12px 14px; }
      .view-control h2 { margin: 0 0 8px; }
      .view-control .turn-row { display: flex; gap: 6px; }
      .view-control .turn-row .bevel { flex: 1; }
      .view-control .muted {
        margin: 8px 0 0;
        font-size: 11px;
        display: flex;
        gap: 4px;
        align-items: baseline;
      }
      /* A reset that reads as text rather than as a button, because it is a way
         back from a state rather than an action worth an equal-weight control. */
      .view-control .link {
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        color: var(--accent);
        cursor: pointer;
        text-decoration: underline;
      }
      .crew { padding: 12px 0; }
      .crew h2 { margin: 0 14px 8px; }
      .crew ul { list-style: none; margin: 0; padding: 0; }
      /* One pixel of left rule, in the crew's own agent colour, so a row says
         which crew it belongs to without a second column. */
      .crew li {
        padding: 4px 14px 4px 12px;
        display: flex;
        gap: 7px;
        align-items: baseline;
        border-left: 1px solid var(--edge);
        font-size: 11px;
      }
      .crew li:hover { background: var(--raised); }
      .crew li.done { opacity: .5; }
      .crew .tier {
        font-family: var(--pixel);
        font-size: 8px;
        text-transform: uppercase;
        letter-spacing: .04em;
        padding: 2px 4px;
        background: var(--accent);
        color: var(--void);
        flex: none;
      }
      .crew .tier.sub { background: var(--edge-lit); color: var(--text); }
      .crew .agent { color: var(--testing); }
      .crew .action { color: var(--text); }
      .crew .at {
        color: var(--done);
        margin-left: auto;
        font-size: 10px;
        overflow-wrap: anywhere;
        text-align: right;
      }

      .feed { flex: 1; overflow-y: auto; padding-bottom: 12px; }
      .feed h2 { margin: 12px 14px 8px; }
      .feed ul { list-style: none; margin: 0; padding: 0; }
      .feed li {
        padding: 5px 14px;
        border-left: 1px solid var(--edge);
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        font-size: 11px;
      }
      .feed li:hover { background: var(--raised); }
      /* A failure is marked by the signal colour on the row's own rule, and by
         a glyph at its head — a whole-row wash would make the feed unreadable
         once a session has a few failures in it. */
      .feed li.err { border-left-color: var(--down); }
      .feed li .type { color: var(--testing); }
      .feed li .tool { color: var(--text-dim); }
      .feed li .path { color: var(--done); overflow-wrap: anywhere; }
      .feed li.err .type::before { content: "! "; color: var(--down); }

      /* A visible, themed focus state for keyboard users on the two
         interactive controls, rather than the browser's default ring. */
      select:focus-visible, button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      /* Below the width where a side panel and a town can share a screen, the
         layout stacks instead of shrinking the town to a sliver. Measured: at
         390px the fixed 316px panel left the canvas 74px wide, which is not a
         town anyone can read. The town gets the top two thirds and keeps its
         full width; the panel scrolls underneath. */
      @media (max-width: 900px) {
        .app { flex-direction: column; }
        #town { flex: 0 0 62%; min-height: 0; }
        .panel {
          width: 100%;
          flex: 1 1 auto;
          min-height: 0;
          border-left: none;
          border-top: 2px solid var(--edge-dark);
        }
        /* With the panel full width, its rows get room to breathe rather than
           being cramped into a 316px column. */
        .crew .at { text-align: right; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
