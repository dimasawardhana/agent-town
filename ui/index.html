<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Town</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        background: #11161d;
        color: #dce3ea;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      .app { display: flex; height: 100%; }
      #town { flex: 1; position: relative; }
      #town canvas { display: block; }

      .panel {
        width: 300px;
        flex: none;
        border-left: 1px solid #232c38;
        background: #151b24;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel header {
        display: flex; align-items: center; gap: 8px;
        padding: 14px 16px; border-bottom: 1px solid #232c38;
      }
      .panel h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: .04em; }
      .dot { width: 7px; height: 7px; border-radius: 50%; margin-left: auto; }
      .dot.ok { background: #4a8f5f; }
      .dot.down { background: #8f4a4a; }

      .meta { margin: 12px 16px 0; color: #7f8fa3; font-size: 12px; }
      .muted { color: #6b7a8d; padding: 0 16px; font-size: 12px; }
      .error { color: #e08080; padding: 8px 16px; margin: 0; font-size: 12px; }

      .detail { padding: 14px 16px; border-bottom: 1px solid #232c38; }
      .detail h2 { font-size: 12px; margin: 0 0 8px; color: #9fb0c4; text-transform: uppercase; letter-spacing: .05em; }
      .detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
      .detail dt { color: #6b7a8d; }
      .detail dd { margin: 0; overflow-wrap: anywhere; }
      .detail button {
        margin-top: 10px; background: #232c38; color: #dce3ea;
        border: 1px solid #2f3a49; border-radius: 4px; padding: 4px 10px;
        font: inherit; cursor: pointer;
      }

      .feed { flex: 1; overflow-y: auto; padding-bottom: 12px; }
      .feed h2 { font-size: 12px; margin: 14px 16px 8px; color: #9fb0c4; text-transform: uppercase; letter-spacing: .05em; }
      .feed ul { list-style: none; margin: 0; padding: 0; }
      .feed li { padding: 5px 16px; border-left: 2px solid #232c38; display: flex; gap: 8px; flex-wrap: wrap; }
      .feed li.err { border-left-color: #8f4a4a; }
      .feed .type { color: #7fb0d8; }
      .feed .tool { color: #9fb0c4; }
      .feed .path { color: #6b8a6b; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
